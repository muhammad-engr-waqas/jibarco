<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JIBARCO - Portal Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
        }
        .form-input {
            width: 100%;
            padding: 9px 12px;
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            color: #0f172a;
            outline: none;
            transition: all 0.15s ease;
        }
        .form-input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6">

    <div class="max-w-md w-full">

        <!-- Logo & Header -->
        <div class="text-center mb-6">
            <img src="logo.jpeg" alt="JIBARCO Logo" class="h-20 w-auto mx-auto mb-4 object-contain rounded-lg">
            <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">JIBARCO COMPANY</h1>
            <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mt-0.5">CONTRACTING COMPANY LLC · KSA</p>
        </div>

        <!-- Login Card -->
        <div class="bg-white rounded-2xl border border-slate-200/90 shadow-sm p-7 sm:p-8">

            <div class="mb-6">
                <h2 class="text-base font-bold text-slate-800">Sign In</h2>
                <p class="text-xs text-slate-400 mt-0.5">Enter your credentials to access the portal</p>
            </div>

            <!-- Error/Success Alert Box -->
            <div id="alertBox" class="hidden mb-4 p-3 rounded-xl text-xs font-medium border flex items-center gap-2">
                <span id="alertIcon" class="font-bold"></span>
                <span id="alertMessage"></span>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5" for="loginEmail">Email / Username</label>
                    <input type="email" id="loginEmail" required placeholder="faisal@jibarco.com" class="form-input placeholder:text-slate-400">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5" for="loginPassword">Password</label>
                    <div class="relative">
                        <input type="password" id="loginPassword" required placeholder="••••••••" class="form-input pr-10 placeholder:text-slate-400">
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600">
                            <svg id="eyeIcon" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="flex items-center text-xs pt-1">
                    <label class="flex items-center gap-2 text-slate-500 cursor-pointer select-none">
                        <input type="checkbox" checked class="rounded border-slate-300 text-blue-600 focus:ring-0">
                        <span>Remember me</span>
                    </label>
                </div>

                <button type="submit" id="loginBtn" class="w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm rounded-xl shadow-sm hover:shadow transition-all flex items-center justify-center gap-2">
                    <span id="loginBtnText">Sign In</span>
                    <svg id="loginSpinner" class="hidden animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </button>
            </form>

        </div>

        <!-- Simple Footer -->
        <p class="text-center text-xs text-slate-400 mt-6">
            JIBARCO COMPANY · The Southern Al-Khobar, Darin Street
        </p>

    </div>

    <script>
        function showAlert(type, message) {
            const alertBox = document.getElementById('alertBox');
            const alertMessage = document.getElementById('alertMessage');
            const alertIcon = document.getElementById('alertIcon');

            alertBox.classList.remove('hidden', 'bg-red-50', 'text-red-700', 'border-red-200', 'bg-emerald-50', 'text-emerald-700', 'border-emerald-200');

            if (type === 'error') {
                alertBox.classList.add('bg-red-50', 'text-red-700', 'border-red-200');
                alertIcon.textContent = '✕';
            } else {
                alertBox.classList.add('bg-emerald-50', 'text-emerald-700', 'border-emerald-200');
                alertIcon.textContent = '✓';
            }

            alertMessage.textContent = message;
        }

        function hideAlert() {
            document.getElementById('alertBox').classList.add('hidden');
        }

        function togglePasswordVisibility() {
            const input = document.getElementById('loginPassword');
            const icon = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.add('text-blue-600');
            } else {
                input.type = 'password';
                icon.classList.remove('text-blue-600');
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            hideAlert();

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');
            const spinner = document.getElementById('loginSpinner');
            const btnText = document.getElementById('loginBtnText');

            btn.disabled = true;
            spinner.classList.remove('hidden');
            btnText.textContent = 'Signing in...';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (!res.ok || !data.success) {
                    showAlert('error', data.message || 'Invalid email or password.');
                    btn.disabled = false;
                    spinner.classList.add('hidden');
                    btnText.textContent = 'Sign In';
                    return;
                }

                if (data.token) {
                    localStorage.setItem('jibarco_token', data.token);
                    localStorage.setItem('jibarco_user', JSON.stringify(data.user));
                }

                showAlert('success', 'Login successful! Redirecting...');
                setTimeout(() => {
                    window.location.href = '/index.html';
                }, 500);

            } catch (err) {
                console.error(err);
                showAlert('error', 'Network error. Please try again.');
                btn.disabled = false;
                spinner.classList.add('hidden');
                btnText.textContent = 'Sign In';
            }
        }
    </script>
</body>
</html>
